name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-boot:
    name: Lint & Boot Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for syntax errors
        run: node --check server.js

      # Strict gate: dead-code must stay at zero. Intentional exports (orchestrator pattern
      # toolkit, multiModel API, module internals, CRM facade) are whitelisted in
      # .fallowrc.json ignoreExports — so a NEW unused export will (correctly) fail the build.
      # DEP-06: these ran as `npx fallow`, which falls back to FETCHING AND EXECUTING whatever the
      # registry serves when no local binary is present — unpinned code, in CI, with repo access.
      # `npm ci` above installs the lockfile-exact fallow, so the direct path always resolves it,
      # and if it is ever missing this fails loudly instead of silently downloading a substitute.
      # `npx --no` was tried first and rejected: it still queried the registry in testing, so its
      # semantics are not something to rely on for a supply-chain control.
      - name: Dead code check (fallow)
        run: ./node_modules/.bin/fallow dead-code

      - name: Duplication check (fallow)
        run: ./node_modules/.bin/fallow dupes

      # Deterministic security gate: encodes the vuln classes from the 2026-07-01 audit
      # (path traversal, missing-auth routes, shell injection, JSON-LD breakout). Fails on any ERROR.
      - name: Security lint (seclint)
        run: node tools/seclint.js --ci

      # Every tools/test-*.js regression suite (analytics ingest, OKF, lead forms, section
      # renderers, funnel/dynamic pages). New suites are picked up by filename convention.
      - name: Regression suites
        run: node tools/test-all.js

      # Public copy must mention every feature in the manifest (README + landing featureList).
      # Shipped a public-surface feature? Update both surfaces + the manifest in the same commit.
      - name: Copy drift check
        run: node tools/check-copy-drift.js

      - name: Verify commercial fallback (Community core)
        run: |
          node -e "
            let c; try { c = require('./commercial/loader'); } catch { c = require('./lib/commercial-stub'); }
            console.log('Tier:', c.tier);
            console.log('Features:', Object.keys(c.features).length);
            console.log('RegisterRoutes:', typeof c.registerRoutes);
            if (c.tier !== 'community') { process.exit(1); }
            if (typeof c.registerRoutes !== 'function') { process.exit(1); }
            console.log('Commercial fallback OK');
          "

      - name: Boot server (smoke test)
        run: |
          timeout 10 node -e "
            const http = require('http');
            process.env.DEMO_MODE = 'true';
            process.env.PORT = '3333';
            require('./server.js');
            setTimeout(() => {
              http.get('http://localhost:3333/api/health', (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  const health = JSON.parse(data);
                  console.log('Health:', JSON.stringify(health));
                  if (!health.status) {
                    console.error('Missing status in health response');
                    process.exit(1);
                  }
                  console.log('Boot test PASSED');
                  process.exit(0);
                });
              }).on('error', (err) => {
                console.error('Health check failed:', err.message);
                process.exit(1);
              });
            }, 3000);
          " || if [ $? -eq 124 ]; then echo "Server boot timed out"; exit 1; fi

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # DEP-04: this carried `continue-on-error: true`, so it reported findings and passed anyway.
      # It was not theoretical — the gate exited 1 inside a GREEN build on every run for months
      # while four HIGH advisories sat in the tree (adm-zip, brace-expansion, ip-address, js-yaml).
      # A gate that cannot fail is worse than no gate: it produces a green tick that means nothing
      # and trains everyone to trust it.
      #
      # The flag could only come off once the tree was actually clean, which is what this commit
      # did. It is now a REAL gate — a new HIGH advisory fails the build.
      #
      # `--audit-level=high` is deliberate, not laziness. Two moderates remain (exceljs -> uuid) and
      # their only fix is `npm audit fix --force`, which DOWNGRADES exceljs to 3.4.0 — a breaking
      # change to xlsx generation to resolve a bounds check in a UUID path this codebase does not
      # take. Raising the bar to `moderate` today would fail the build and invite someone to add
      # `continue-on-error` back, which is the exact failure this commit exists to end. Revisit when
      # exceljs ships a fix.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check for secrets in code
        run: |
          # Fail if real API keys are committed (not placeholders)
          if grep -rn "sk_live_" --include="*.js" --include="*.json" --include="*.env" .; then
            echo "ERROR: Live Stripe key found in source"
            exit 1
          fi
          if grep -rn "sk-[a-zA-Z0-9]\{20,\}" --include="*.js" --include="*.json" . | grep -v node_modules | grep -v ".example"; then
            echo "WARNING: Possible API key in source"
          fi
          echo "Secret scan passed"
