name: content-pipeline
description: Content creation pipeline — research, write, review, publish-ready
trigger: manual
estimated_time: ~30min

stages:
  - id: brief
    skill: research-brief
    agent: researcher
    inputs:
      topic: "{{topic}}"
    outputs:
      - research_brief
      - key_points
    timeout: 10m

  - id: draft
    skill: content-creation
    agent: writer
    depends_on: [brief]
    inputs:
      brief: "{{brief.research_brief}}"
      format: "{{format}}"
      tone: "{{tone|professional}}"
    outputs:
      - draft_content
      - meta_description
    timeout: 10m

  - id: seo
    skill: seo-audit
    agent: deepseek-worker
    depends_on: [draft]
    inputs:
      content: "{{draft.draft_content}}"
      keywords: "{{keywords}}"
    outputs:
      - seo_score
      - recommendations
    timeout: 5m

  # An adversarial panel on the DRAFT, before a human is asked to approve it. See the longer note in
  # research-to-report.yaml for why this is not the same thing as the `review` stage below.
  # `on_refute: gate` — contested copy is a human decision, not something to discard automatically.
  # Cost note: n=3 means three real agent dispatches.
  - id: skeptic
    pattern: skeptic
    depends_on: [draft]
    n: 3
    verifier: reviewer
    on_refute: gate
    outputs:
      - panel_verdict
    timeout: 8m

  - id: review
    skill: content-creation
    agent: reviewer
    depends_on: [draft, seo, skeptic]
    inputs:
      content: "{{draft.draft_content}}"
      seo_feedback: "{{seo.recommendations}}"
      panel: "{{skeptic.panel_verdict}}"
    outputs:
      - verdict
      - final_content
    gate: advisory
    timeout: 5m

parameters:
  topic:
    type: string
    required: true
  format:
    type: enum
    options: [blog-post, documentation, newsletter, social-thread]
    default: blog-post
  tone:
    type: enum
    options: [professional, casual, technical, persuasive]
    default: professional
  keywords:
    type: string
    required: false
    description: Comma-separated target keywords

output_artifact: "content-{{format}}-{{date}}.md"
vault_folder: outputs
