# AI OS Virtual Corporate HQ — Nginx Reverse Proxy
# Place at: /etc/nginx/sites-available/ai-os
# Symlink: ln -s /etc/nginx/sites-available/ai-os /etc/nginx/sites-enabled/ai-os
# Domain placeholder replaced automatically by install-vps.sh

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    # `listen ... ssl http2` was deprecated in nginx 1.25.1 in favour of a separate directive.
    # REQUIRES nginx >= 1.25.1 — `http2 on;` is a hard error on older builds. That floor is met by
    # every platform install-vps.sh targets (Debian 12/13 ship 1.22+/1.26+). Unlike the per-site
    # generator in deploy/hosting/site-vhost.sh, a static template cannot detect the local version,
    # so this is a documented requirement rather than a runtime choice. If you are self-hosting on
    # something older, collapse the two lines below back into `listen 443 ssl http2;`.
    listen 443 ssl;
    http2 on;
    server_name yourdomain.com;

    # TLS — managed by Certbot (auto-populated after certbot --nginx)
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # vhost-attributed analytics (format from /etc/nginx/conf.d/aios-logformat.conf)
    access_log /var/log/nginx/access.log aios_vhost;

    # Security headers (supplement Helmet)
    #
    # ⚠️ THESE ARE NOT INHERITED BY A location BLOCK THAT DECLARES ITS OWN add_header (AS-01/AS-03).
    # nginx inherits add_header from the enclosing level ONLY IF the current level declares none —
    # one `add_header Cache-Control` in a child REPLACES this whole set rather than adding to it.
    # `/css/`, `/js/` and `/docs/` each set Cache-Control, so all five headers below were silently
    # absent there, including nosniff on the JavaScript path. They are repeated in those three
    # blocks. `/assets/` and `/favicon.ico` use `expires`, which is a different directive and does
    # NOT break inheritance, so they still get these and are deliberately left alone.
    #
    # The repetition is REQUIRED by nginx's semantics — do not "de-duplicate" it. If you add another
    # location block that sets any add_header, repeat these five there too.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 6;

    # --- Static files — served directly by Nginx, bypass Node ---
    # NOTE: filenames here are NOT content-hashed (app.js, landing.css stay the same across deploys),
    # so "immutable" must NOT be used — it tells browsers to never revalidate, which makes every
    # deploy invisible for days (a new feature's HTML renders but its stale cached JS never loads).
    # CSS/JS/HTML revalidate (cheap ETag 304s when unchanged); only images get a real cache.
    location /css/ {
        alias /opt/ai-os/dashboard/css/;
        add_header Cache-Control "no-cache";
        # Repeated because this block's own add_header cancels inheritance — see the note at the
        # server-level set. Not duplication to tidy away.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        access_log off;
    }

    location /js/ {
        alias /opt/ai-os/dashboard/js/;
        add_header Cache-Control "no-cache";
        # Repeated because this block's own add_header cancels inheritance. nosniff matters most
        # HERE: this is the path that serves JavaScript.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        access_log off;
    }

    location /assets/ {
        alias /opt/ai-os/dashboard/assets/;
        # Images/fonts: cache a week, but NOT immutable (a replaced asset under the same name must
        # be able to update; rename it to force an instant refresh).
        expires 7d;
        access_log off;
    }

    # The docs INDEX, canonicalised. `/docs/` (trailing slash) used to 404 while `/docs`,
    # `/docs/index.html` and every subpage returned 200 — measured on the live site, not assumed.
    # Why it 404s: the block below uses `alias` + `try_files $uri $uri.html =404`. For `/docs/`,
    # `$uri` resolves to a DIRECTORY (no `index` is consulted once try_files is present), then
    # `/docs/.html` does not exist, so it falls to `=404`. `/docs` without the slash never matches
    # the `/docs/` prefix at all, so it falls through to Node's own route and works — which is why
    # the site itself looked fine and nothing internal linked to the broken form.
    # Nothing user-facing was broken; the cost was to CRAWLERS that normalise to a trailing slash,
    # which matters here because the docs index is an AEO entry point.
    # `= ` is an EXACT match, so it takes priority over the `/docs/` prefix block and affects only
    # this one URI. Redirecting toward the slashless form is the CANONICALISING direction:
    # sitemap.xml already declares `/docs`, and serving both would create a duplicate-content pair.
    # Loop safety was checked, not assumed: nothing redirects `/docs` → `/docs/` (no Express
    # redirect, no rewrite here), so the 301 terminates at Node. The scheme is written out in full
    # rather than left to `$scheme` — a relative redirect emitted by an origin sitting behind a
    # Flexible-SSL CDN can go out as `http://` and bounce, which is the shape that took aiserp.org
    # down for ~15 minutes.
    location = /docs/ {
        return 301 https://$host/docs;
    }

    location /docs/ {
        alias /opt/ai-os/dashboard/docs/;
        # Every internal docs link (nav, docs/index.html cards, page-nav, this repo's own
        # docPages Express routes) is extension-less, e.g. /docs/hermes — but `alias` does a
        # literal filesystem lookup with no .html fallback, so it 404s here before ever reaching
        # Node (whose own /docs/:page route DOES map it to hermes.html correctly, but is never
        # hit because this location block intercepts the whole /docs/ prefix first). try_files
        # closes that gap: try the literal URI, then the same path + .html, else 404.
        try_files $uri $uri.html =404;
        # Docs are HTML that changes on deploy — revalidate so updates aren't a day stale.
        add_header Cache-Control "no-cache";
        # Repeated because this block's own add_header cancels inheritance — see the server-level
        # note. These are user-facing HTML pages, so X-Frame-Options matters here.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        access_log off;
    }

    location /favicon.ico {
        alias /opt/ai-os/dashboard/favicon.ico;
        expires 30d;
        access_log off;
    }

    location /robots.txt {
        alias /opt/ai-os/dashboard/robots.txt;
        access_log off;
    }

    # --- WebSocket upgrade (dashboard live updates) ---
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # --- API proxy with rate limiting ---
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;

        # Rate limit at Nginx layer (backup to Express rate-limit)
        limit_req zone=api burst=20 nodelay;
    }

    # --- Stripe webhook (needs raw body, longer timeout) ---
    location /api/stripe/webhook {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        # No rate limit on webhook
    }

    # --- Hermes MCP proxy — CLOSED BY DEFAULT (AS-01) ---
    # This block used to carry the comment "Restrict to authenticated requests only" above a
    # `limit_req` directive. limit_req is a RATE LIMIT, not authentication: there was no auth_basic,
    # no auth_request and no allow/deny anywhere in the block. The comment described a control that
    # did not exist, and the hermes MCP server has no auth of its own — so the day someone
    # uncomments the `hermes` service in docker-compose.yml, this would publish an unauthenticated
    # MCP endpoint to the internet while the config appeared to say otherwise.
    #
    # It is now genuinely closed. Enabling hermes is therefore a TWO-step decision — start the
    # service AND choose an auth mechanism here — instead of one step that silently does both.
    # Whichever you pick (auth_request against the app, mTLS, or an allowlist), replace the
    # `deny all` rather than deleting it, and do not restore a comment this block cannot honour.
    location /hermes/ {
        deny all;

        proxy_pass http://127.0.0.1:8420/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        limit_req zone=api burst=5 nodelay;
    }

    # --- HTML pages via Node ---
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Block sensitive paths ---
    location ~ /\.(env|git|magent|claude) {
        deny all;
        return 404;
    }

    # Block access to state files
    location ~ /(state|vault|artifacts)/ {
        deny all;
        return 404;
    }

    # Max upload size (for future file uploads)
    client_max_body_size 25M;
}

# Rate limit zone — add to http {} block of /etc/nginx/nginx.conf:
# limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
