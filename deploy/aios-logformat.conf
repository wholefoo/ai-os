# AI OS — vhost-aware access log format for the analytics ingester.
# Place at: /etc/nginx/conf.d/aios-logformat.conf   (http-level; log_format cannot live in a server block)
# Then reload: sudo nginx -t && sudo systemctl reload nginx
#
# Identical to the stock "combined" format with $host prepended, so the platform's analytics
# ingester (lib/analytics/ingest-logs.js) can attribute every request to the Web Studio site
# that serves that domain. The ingester auto-detects both this format and plain combined, so
# rollout order doesn't matter and old log lines keep parsing.
log_format aios_vhost '$host $remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
