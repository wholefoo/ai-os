<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Set your password — AI OS</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b1020;color:#e7eaf3;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
  .card{width:100%;max-width:380px;background:#141a2e;border:1px solid #232c45;border-radius:14px;padding:28px;}
  h1{font-size:20px;margin:0 0 6px;}
  p{color:#9aa3bd;font-size:14px;margin:0 0 6px;}
  label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#9aa3bd;margin:14px 0 6px;}
  input{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:8px;border:1px solid #2b3552;background:#0e1426;color:#e7eaf3;font-size:14px;}
  button{width:100%;margin-top:18px;padding:11px;border:0;border-radius:8px;background:#4f46e5;color:#fff;font-weight:600;font-size:14px;cursor:pointer;}
  button:disabled{opacity:.6;cursor:default;}
  .msg{margin-top:12px;font-size:13px;min-height:18px;}
  .err{color:#fca5a5;} .ok{color:#86efac;}
</style>
</head>
<body>
  <div class="card">
    <h1>Set your password</h1>
    <p>Create a password to access your Web Studio dashboard.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="new-password" placeholder="At least 8 characters" />
    <label for="pw2">Confirm password</label>
    <input id="pw2" type="password" autocomplete="new-password" placeholder="Re-enter password" />
    <button id="go">Set password &amp; continue</button>
    <div class="msg" id="msg"></div>
  </div>
<script>
  var params = new URLSearchParams(location.search);
  var token = params.get('token') || '';
  var msg = document.getElementById('msg');
  if (!token) { msg.className = 'msg err'; msg.textContent = 'Missing or invalid setup link.'; document.getElementById('go').disabled = true; }
  document.getElementById('go').addEventListener('click', async function () {
    var pw = document.getElementById('pw').value, pw2 = document.getElementById('pw2').value;
    msg.className = 'msg';
    if (pw.length < 8) { msg.className = 'msg err'; msg.textContent = 'Password must be at least 8 characters.'; return; }
    if (pw !== pw2) { msg.className = 'msg err'; msg.textContent = 'Passwords do not match.'; return; }
    var btn = document.getElementById('go'); btn.disabled = true; msg.textContent = 'Setting your password…';
    try {
      var r = await fetch('/api/auth/set-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ token: token, password: pw }) });
      var data = await r.json();
      if (!r.ok || data.error) { msg.className = 'msg err'; msg.textContent = data.error || ('Error ' + r.status); btn.disabled = false; return; }
      msg.className = 'msg ok'; msg.textContent = 'Done — taking you to your dashboard…';
      location.href = data.redirect || '/app';
    } catch (e) { msg.className = 'msg err'; msg.textContent = 'Network error — try again.'; btn.disabled = false; }
  });
</script>
</body>
</html>
